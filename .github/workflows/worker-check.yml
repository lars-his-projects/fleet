name: worker-check

# Proves the fleet worker on polopc: the tools are there and Chromium loads a page.
# Only a person or an agent with write access starts it. Never add a pull request trigger: a workflow of a
# fork must not run on polopc (tests/test_fleet_worker_kit.py).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: [self-hosted, polopc]
    timeout-minutes: 10
    steps:
      - name: Versions
        run: |
          git --version
          python3 --version
          node --version
          claude --version
      - name: Load a page in Chromium
        # --no-sandbox: the container drops all capabilities, so the sandbox of Chromium cannot start.
        run: |
          /opt/playwright/bin/python - <<'EOF'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True, args=["--no-sandbox"])
              page = browser.new_page()
              page.goto("https://example.org", timeout=30000)
              print("title:", page.title())
              browser.close()
          EOF
