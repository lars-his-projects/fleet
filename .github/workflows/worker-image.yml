name: worker-image

# Builds the image of the fleet worker (deploy/worker/) and pushes it to ghcr.io. Watchtower on polopc
# pulls the new image. The weekly build takes in the new runner, Chromium and CLI versions.
on:
  push:
    branches: [main]
    paths:
      - "deploy/worker/**"
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: worker-image
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: deploy/worker
          pull: true
          push: true
          tags: ghcr.io/lars-his-projects/fleet-worker:latest
