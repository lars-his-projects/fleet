# The owner's settings of the agent system (framework/tools/agent_config.py joins them with agent.toml).

[pacing]
max_runs = 4                    # the most runs at one time (framework/tools/usage.py); small while each project has its own pacer
                                # on the same quota (roadmap pacer:one, stage 2 removes this limit)
max_waiting_prs = 10            # flow brake: at this many old agent PRs the pacer starts only 1 repair run
max_ci_queue = 5                # flow brake: at this many queued CI runs the pacer starts no run
week_free = 0.0                 # below this 7-day usage the runs fill each 5-hour window; 0: the weekly pace counts from the start of the week (framework/tools/usage.py)
week_guard = false              # true: the 7-day usage limits the runs; false: only the 5-hour window counts. It is false until
                                # the device tickets run on the worker (owner, 2026-11-14, "hub now"): the PR that sets
                                # `workers:devices` to [x] in the roadmap sets it back to true (CLAUDE.md, "Rules")
refill_roadmap = false          # false: the pacer starts no refill run for a roadmap feature with no epic. It is false while
                                # `week_guard` is false: the same PR removes this line (9 empty runs in 90 minutes, 2026-11-14)
owner_first = 1                 # the runs that start above the weekly pace while work of an owner waits: a comment with no
                                # answer, or a new issue with no label (framework/tools/usage.py, `owner_wait`). 0: none
week_share = 0.375              # the part of the weekly budget of the account that this project plans with (its weight in fleet.toml of the hub: 3 of 8)
week_reserve = 0.10             # the part of the week that the runs leave to the sessions of the owner, until 12 hours before the weekly reset
weights = { haiku = 0.25, sonnet = 0.5, fable = 2.5 }   # a lane run in Opus runs: Haiku is measured; Sonnet and Fable are start values from the list prices (2026-11-14)
reserved = ["haiku", "sonnet", "fable", "device"]    # lanes whose tickets the Opus runs never take. The name of a lane is its model (owner, 2026-11-14).
                                # `device` is no model: it has no weight, so no cloud run and no starter session takes its tickets (#13)
duty = "opus"                   # the lane of the epic check, the queue refill and the reviews. `opus` is the default lane (no lane label);
                                # a reserved lane here (`fable`) gives this work to the runs of that lane only
# On since 2026-11-13: the owner finished the account steps (the secrets and the scheduled tasks, card 3).
pacer = "workflow"              # pacer.yml plans the runs each 10 minutes (framework/tools/pacer.py); another value stops its loop
starts = "session"              # the starter session starts the planned runs (docs/STARTER.md): the hub needs no scheduled task
                                # and no secret. With no `starts` line, pacer.yml starts them with the API triggers of the
                                # scheduled tasks, as before 2026-11-14
trigger = "trig_01U5nL2JcLJ4ueit4xCkH6dT"   # the ID of the scheduled task "fleet autopilot": framework/docs/OPERATOR.md, section 3

[review]                        # the process review (`improve` skill): merged PRs, never hours
gap = 80                        # merged PRs: the first gap, and the reset when the result of the reviews turns
min_gap = 10                    # a review with a change halves a gap up to `gap`, down to this
max_gap = 640                   # a review with no change doubles a gap from `gap` up, up to this
owner_gap = 20                  # the gap when an owner session merged a PR since the last review
